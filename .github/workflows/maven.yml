name: "[Auto] Java CI with Maven"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - uses: sdkman/sdkman-action@main
        id: sdkman-jextract
        with:
          candidate: jextract
          version: 22.ea.6

      - name: Check sources with Maven
        run: |
          mvn -B -ntp -f jgpio/pom.xml license:check
        # TODO check formatting

      - name: Build with Maven
        run: |
          ./prepare.sh
          mvn -B -ntp -f jgpio/pom.xml install
          mvn -B -ntp -f jgpio/pom.xml clean verify artifact:compare
          mvn -B -ntp -f jgpio-it/pom.xml package
          mvn -B -ntp -f examples/basics/pom.xml package
          mvn -B -ntp -f examples/testing/pom.xml verify

  test-it:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - uses: sdkman/sdkman-action@main
        id: sdkman-jextract
        with:
          candidate: jextract
          version: 22.ea.6

      - name: Test IT
        run: |
          ./prepare.sh
          ./prepare-docker-images.sh
          ./mvnw -B -ntp -f jgpio/pom.xml install -DskipTests
          ./mvnw -B -ntp -f jgpio-it/pom.xml verify -Dgroups=container-launcher

  build-native-it:
    needs: build
    # native-image needs a few GB of memory, too much for the self-hosted test board
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - uses: sdkman/sdkman-action@main
        id: sdkman-jextract
        with:
          candidate: jextract
          version: 22.ea.6

      - name: Build native IT
        # the native profile is activated on the host only to resolve its dependencies for the
        # offline builder container, the image itself is built by NativeBuildIT
        run: |
          ./prepare.sh
          docker build -f docker/it-native-builder.Dockerfile -t lib-jgpio-it:native-builder .
          ./mvnw -B -ntp -f jgpio/pom.xml install -DskipTests
          ./mvnw -B -ntp -f jgpio-it/pom.xml verify -Pnative -DskipNativeTests -Dgroups=native-build

      - uses: actions/upload-artifact@v7
        with:
          name: native-it
          path: jgpio-it/target/native-it/
          if-no-files-found: error

  test-native-it:
    needs: build-native-it
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - uses: sdkman/sdkman-action@main
        id: sdkman-jextract
        with:
          candidate: jextract
          version: 22.ea.6

      - uses: actions/download-artifact@v8
        with:
          name: native-it
          path: jgpio-it/target/native-it/

      - name: Test native IT
        run: |
          ./prepare.sh
          ./prepare-docker-images.sh
          ./mvnw -B -ntp -f jgpio/pom.xml install -DskipTests
          ./mvnw -B -ntp -f jgpio-it/pom.xml verify -Dgroups=native-container-launcher -Djgpio.it.native.prebuilt=true
